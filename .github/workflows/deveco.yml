# Build DevEco Studio outside the CI package loop.
#
# Secret, in GitHub Settings → Secrets and variables → Actions, for
# JimmyWang0417/nur-packages:
#   HDX_CREDENTIALS
#     The whole ~/.config/hdx/credentials.json from one local `hdx auth login`.
#     That login needs a Huawei ID username, password, and a one-time SMS code.
#     Actions cannot enter the SMS code. `hdx auth refresh` uses this file.
#     Do not also store the password in the repo. Do not create a second secret
#     for the SMS code; it cannot be reused.
#
# This job downloads with hdx and builds in the same run. It does not upload
# the Huawei zips or the assembled IDE to a GitHub release.

name: deveco

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Free disk on the runner image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wine for the Windows hdx binary
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y wine

      - name: Install hdx
        run: |
          set -euo pipefail
          curl -fsSL -o hdx.zip -L \
            https://github.com/chawyehsu/hdx/releases/download/v0.1.2/hdx-x86-64-pc-windows-msvc.zip
          echo "11686c862071b757c22fa9ef1461e7f275196f070c568fe17b08d1d75aa83d6e  hdx.zip" | sha256sum -c -
          unzip -q hdx.zip
          test -f hdx.exe

      - name: Restore hdx credentials and build
        env:
          HDX_CREDENTIALS: ${{ secrets.HDX_CREDENTIALS }}
          WINEDEBUG: "-all"
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("HDX_CREDENTIALS", "")
          if not raw.strip():
              sys.exit("GitHub secret HDX_CREDENTIALS is empty")
          try:
              json.loads(raw)
          except Exception:
              sys.exit("HDX_CREDENTIALS is not JSON. Paste ~/.config/hdx/credentials.json")
          print("HDX_CREDENTIALS parsed")
          PY

          umask 077
          config="${RUNNER_TEMP}/hdx-config"
          work="${RUNNER_TEMP}/deveco-src"
          export WINEPREFIX="${RUNNER_TEMP}/hdx-wine"
          trap 'rm -rf "$config" "$work" "$WINEPREFIX"' EXIT
          mkdir -p "$config/hdx" "$work"
          printf '%s' "$HDX_CREDENTIALS" > "$config/hdx/credentials.json"

          wineboot --init
          export XDG_CONFIG_HOME="$(winepath -w "$config")"
          wine_user=$(find "$WINEPREFIX/drive_c/users" -mindepth 1 -maxdepth 1 -type d ! -name Public -print -quit)
          mkdir -p "$wine_user/.config/hdx" "$wine_user/AppData/Roaming/hdx"
          cp -a "$config/hdx/credentials.json" "$wine_user/.config/hdx/credentials.json"
          cp -a "$config/hdx/credentials.json" "$wine_user/AppData/Roaming/hdx/credentials.json"
          python3 pkgs/deveco-studio/hdx_dget.py \
            --hdx "$PWD/hdx.exe" --refresh \
            --tool deveco-studio \
            --out "$work/devecostudio-mac.zip"
          python3 pkgs/deveco-studio/hdx_dget.py \
            --hdx "$PWD/hdx.exe" \
            --tool command-line-tools-for-hmos \
            --out "$work/commandline-tools-linux-x64.zip"

          nix --extra-experimental-features 'nix-command flakes' build \
            --impure --no-link --print-out-paths --expr "
              let
                flake = builtins.getFlake (toString ./.);
                pkgs = import flake.inputs.nixpkgs {
                  system = \"x86_64-linux\";
                  config.allowUnfree = true;
                };
              in
              pkgs.callPackage ./pkgs/deveco-studio {
                macZip = ${work}/devecostudio-mac.zip;
                cliZip = ${work}/commandline-tools-linux-x64.zip;
              }
            "
          # EXIT trap removes the credential file, the zips, and the wine prefix.
