name: update

on:
  workflow_dispatch:
  schedule:
    # Monday 04:17 UTC updates every allow-listed package.
    # 16:00 UTC every day updates github-rev only. A pull request is opened
    # only when rev and hash change.
    - cron: "17 4 * * 1"
    - cron: "0 16 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump packages listed in updates.nix
        env:
          UPDATE_KINDS: ${{ github.event.schedule == '0 16 * * *' && 'github-rev' || '' }}
        run: python3 ./scripts/update.py
      - name: Validate changed Typora plugin before opening a PR
        run: |
          if ! git diff --quiet -- pkgs/typora/sources.nix; then
            nix --extra-experimental-features 'nix-command flakes' build --no-link --print-out-paths \
              .#typora .#typora.tests.layout .#typora.tests.runtime .#typora.tests.gui
          fi
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "no upstream changes"
            exit 0
          fi
          stamp="$(date -u +%Y%m%d%H%M%S)"
          if [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            prefix="daily"
          else
            prefix="weekly"
          fi
          branch="update/${prefix}-${stamp}"
          git checkout -B "$branch"
          git add -- pkgs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "更新 updates.nix 里的上游包"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "更新 updates.nix 里的上游包" \
            --body "由 .github/workflows/update.yml 根据 updates.nix 生成。rev 和 hash 没有变化时不会开 pull request，也不会 force-push。"
