name: update

on:
  workflow_dispatch:
  schedule:
    # Monday 04:17 UTC updates every allow-listed package.
    # 16:00 UTC every day updates github-rev only. Changed files are
    # committed and pushed to main. Nothing is pushed when nothing changed.
    - cron: "17 4 * * 1"
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump packages listed in updates.nix
        env:
          UPDATE_KINDS: ${{ github.event.schedule == '0 16 * * *' && 'github-rev' || '' }}
        run: python3 ./scripts/update.py
      - name: Validate changed Typora plugin before committing
        run: |
          if ! git diff --quiet -- pkgs/typora/sources.nix; then
            nix --extra-experimental-features 'nix-command flakes' build --no-link --print-out-paths \
              .#typora .#typora.tests.layout .#typora.tests.runtime .#typora.tests.gui
          fi
      - name: Commit and push to main
        run: |
          if git diff --quiet; then
            echo "no upstream changes"
            exit 0
          fi
          git add -- pkgs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "更新 updates.nix 里的上游包"
          git push origin HEAD:main
