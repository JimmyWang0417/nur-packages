name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump packages listed in updates.nix
        run: python3 ./scripts/update.py
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "no version changes"
            exit 0
          fi
          stamp="$(date -u +%Y%m%d%H%M%S)"
          branch="update/weekly-${stamp}"
          git checkout -B "$branch"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "更新 GitHub release 包"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "更新 GitHub release 包" \
            --body "由 .github/workflows/update.yml 根据 updates.nix 生成。这个工作流不会 force-push。"
