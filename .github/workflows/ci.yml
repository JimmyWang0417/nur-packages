name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build every packages.x86_64-linux attribute
        run: |
          attrs_json=$(nix --extra-experimental-features 'nix-command flakes' eval --json .#packages.x86_64-linux --apply builtins.attrNames)
          mapfile -t attrs < <(python3 -c 'import json, sys; print(*(".#" + name for name in json.load(sys.stdin) if name != "deveco-studio"), sep="\n")' <<< "$attrs_json")
          printf 'building %s\n' "${attrs[@]}"
          nix --extra-experimental-features 'nix-command flakes' build --no-link --print-out-paths "${attrs[@]}"
      - name: Check Typora layout, launcher, and GUI
        run: |
          nix --extra-experimental-features 'nix-command flakes' build --no-link --print-out-paths \
            .#typora.tests.layout .#typora.tests.runtime .#typora.tests.gui
      - name: Test Typora plugin update handling
        run: python3 -m unittest discover -s scripts -p 'test_update_typora.py' -v
      - name: Test github-rev update handling
        run: python3 -m unittest discover -s scripts -p 'test_update_rev.py' -v
      - name: Test http-version update handling
        run: python3 -m unittest discover -s scripts -p 'test_update_http_version.py' -v
